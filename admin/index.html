<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الملفات</title><link rel="stylesheet" href="../assets/style.css"><style>
.admin-page{width:min(980px,100%);margin:auto}.admin-card{background:rgba(255,255,255,.95);border:1px solid #dfe7ea;border-radius:28px;padding:25px;box-shadow:0 20px 60px rgba(30,48,55,.09)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.count{color:#87949a;font-size:12px;margin-top:4px}.logout,.download{border:0;text-decoration:none;border-radius:11px;padding:10px 14px;font:700 12px Cairo,Arial;cursor:pointer}.logout{background:#eef2f3;color:#40535a}.download{background:#526d75;color:#fff}.item{display:flex;align-items:center;gap:14px;background:#fafbfb;border:1px solid #e5ebed;border-radius:15px;padding:13px;margin:9px 0}.info{flex:1;min-width:0}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:#87949a;margin-top:4px}.empty{text-align:center;padding:60px 15px;color:#87949a;background:#fafbfb;border-radius:15px}.error{color:#ad4b4b;text-align:center;margin:10px 0;font-size:12px}@media(max-width:600px){.admin-card{padding:16px}.top{align-items:flex-start}.item{flex-wrap:wrap}.info{width:calc(100% - 50px)}.download{width:100%;text-align:center}.top h1{font-size:21px}}
</style></head><body><main class="page admin-page"><section class="admin-card"><div class="top"><div><h1>الملفات</h1><div id="count" class="count"></div></div><button id="logout" class="logout">خروج</button></div><div id="message" class="error"></div><div id="files"></div></section></main><script src="app.js"></script></body></html>
