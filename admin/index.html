<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيسان | الملفات</title><link rel="stylesheet" href="../assets/style.css"><style>.admin{width:min(980px,100%);margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.bar h1{margin:0;text-align:right}.count{color:var(--muted);font-size:12px}.logout{border:1px solid #40525d;background:transparent;color:#fff;border-radius:11px;padding:9px 14px;font:700 12px Cairo;cursor:pointer}.item{display:flex;align-items:center;gap:13px;background:#101b24;border:1px solid #263642;border-radius:16px;padding:13px;margin:8px 0}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#192832;color:var(--accent2)}.info{min-width:0;flex:1}.name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:var(--muted);font-size:10px;margin-top:3px}.download{border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#111;padding:10px 15px;font:800 12px Cairo;cursor:pointer}.empty{text-align:center;padding:55px 20px;border:1px dashed #334651;border-radius:18px;color:var(--muted)}.busy{text-align:center;color:var(--muted);padding:30px}@media(max-width:620px){.bar{align-items:flex-start}.item{flex-wrap:wrap}.info{width:calc(100% - 53px)}.download{width:100%}}
</style></head><body><main class="shell"><section class="upload-card admin"><div class="bar"><div><h1>الملفات</h1><div id="count" class="count"></div></div><button id="logout" class="logout">خروج</button></div><div id="status" class="status"></div><div id="filesList"><div class="busy">جارٍ تحميل الملفات…</div></div></section></main><script src="admin.js"></script></body></html>
