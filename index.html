<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1720">
<title>بيسان | إرسال الملفات</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="shell">
  <section class="upload-card">
    <div class="mark" aria-hidden="true">ب</div>
    <h1>بيسان</h1>
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="اختيار الملفات">
      <input id="files" type="file" multiple hidden>
      <div class="cloud" aria-hidden="true">↑</div>
      <div class="drop-title">ارفع ملفاتك</div>
      <div class="drop-hint">اسحب الملفات هنا أو اضغط للاختيار</div>
      <button id="chooseBtn" class="outline" type="button">اختيار الملفات</button>
    </div>
    <div id="fileList" class="file-list"></div>
    <button id="sendBtn" class="primary" type="button" disabled>إرسال</button>
    <div id="progressWrap" class="progress-wrap" hidden>
      <div class="progress"><span id="progressBar"></span></div>
      <div id="progressText">0%</div>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
  </section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
