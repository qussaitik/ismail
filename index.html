<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قريباً - Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* العداد التنازلي */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .time-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 12px;
      min-width: 80px;
    }

    .number {
      font-size: 2rem;
      font-weight: 700;
      color: #38bdf8;
      display: block;
    }

    .label {
      font-size: 0.8rem;
      color: #64748b;
    }

    /* نموذج الاشتراكات */
    .subscribe-box {
      display: flex;
      gap: 10px;
      max-width: 450px;
      margin: 0 auto;
    }

    input[type="email"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 24px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0284c7;
      color: #fff;
    }

    @media (max-width: 480px) {
      .subscribe-box {
        flex-direction: column;
      }
      .time-box {
        min-width: 65px;
        padding: 12px;
      }
      .number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">ترقبوا الإطلاق</span>
    <h1>موقعنا قادم قريباً جداً!</h1>
    <p>نعمل حالياً على تجهيز شيء رائع لك. اشترك ليصلك إشعار فور انطلاق الموقع.</p>

    <!-- العداد -->
    <div class="countdown">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">يوم</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">ساعة</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">دقيقة</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">ثانية</span>
      </div>
    </div>

    <!-- نموذج البريد الإلكتروني -->
    <form class="subscribe-box" onsubmit="event.preventDefault(); alert('شكراً لاشتراكك!');">
      <input type="email" placeholder="أدخل بريدك الإلكتروني..." required>
      <button type="submit">أبلغني</button>
    </form>
  </div>

  <script>
    // حدد تاريخ الإطلاق المستقبلي هنا (سنة, شهر - 1, يوم)
    const launchDate = new Date(2026, 11, 31, 23, 59, 59).getTime();

    const timer = setInterval(() => {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance < 0) {
        clearInterval(timer);
        document.querySelector('.countdown').innerHTML = "<h3>تم الإطلاق!</h3>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }, 1000);
  </script>

</body>
</html>
